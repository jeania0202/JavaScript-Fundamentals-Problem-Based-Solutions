<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commute Carbon Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<center>
<div class="app">
    <h1><i class="fa-solid fa-car"></i> COMMUTE CARBON TRACKER</h1>
    <div>
      <p class="subtitle"> “Track today, save progress, sustain the future.”</p>
    </div>
</center>
   <div class="card">
    <h2>Log Commute</h2>

    <input type="number" id="distance" placeholder="Distance (km)" />

    <select id="mode">
      <option value="car">🚗 Car</option>
      <option value="bus">🚌 Bus</option>
      <option value="bike">🚴 Bike</option>
      <option value="walk">🚶 Walk</option>
    </select>

    <button onclick="logTrip()">+ Add Trip</button>
<center>
    <p id="result"></p>
  </div>

</center>
<center>
  <div class="card this-week">
    <h2><i class="fa-solid fa-leaf">This Week</i></h2>
    <p id="weekly"></p>
  </div>
  <div class="card your-trips">
    <h3><i class="fa-brands fa-slack"> Your Trips </i></h3>
    <ul id="logList"></ul>
  </div>

</div>
</center>
<script src="script.js"></script>
</body>
</html>
